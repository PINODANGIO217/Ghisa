<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ghisa">
<meta name="theme-color" content="#ECEEE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Ghisa, la tua scheda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#ECEEE8;--surface:#FBFBF8;--panel:#E1E4DC;--ink:#151A1E;--muted:#5A636A;--line:#D0D5CC;
  --accent:#2B45F5;--accent-ink:#FFFFFF;--ok:#12805A;--rest:#F2B01E;--rest-ink:#1B1400;--danger:#C2371F;
  --fig:#151A1E;--prop:#9AA39A;
  --disp:"Big Shoulders Display","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Schibsted Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#101318;--surface:#191D24;--panel:#222730;--ink:#ECEEE8;--muted:#98A1AA;--line:#2D333D;
  --accent:#8698FF;--accent-ink:#0A0E22;--ok:#4CC79A;--rest:#FFC53D;--rest-ink:#1B1400;--danger:#FF8A70;
  --fig:#ECEEE8;--prop:#59626D;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#101318;--surface:#191D24;--panel:#222730;--ink:#ECEEE8;--muted:#98A1AA;--line:#2D333D;
  --accent:#8698FF;--accent-ink:#0A0E22;--ok:#4CC79A;--rest:#FFC53D;--rest-ink:#1B1400;--danger:#FF8A70;
  --fig:#ECEEE8;--prop:#59626D;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);display:flex;align-items:center;justify-content:space-between;max-width:520px;margin:0 auto;padding:10px 16px 8px}
.brand{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}
.icon svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

.date{color:var(--muted);margin:2px 0 12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}
.week button{height:58px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--disp);font-weight:800;font-size:19px}
.week button i{display:block;width:16px;height:4px;border-radius:2px;background:transparent}
.week button.has i{background:var(--accent)}
.week button.today{border-color:var(--ink)}
.week button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week button[aria-pressed="true"].has i{background:var(--bg)}

.h-day{font-family:var(--disp);font-weight:800;font-size:52px;line-height:.95;letter-spacing:-.005em;margin-bottom:8px;overflow-wrap:anywhere}
.sub{color:var(--muted);margin-bottom:16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:44px;font-size:15px;width:auto;padding:0 8px;white-space:nowrap}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 auto}
.link{color:var(--accent);font-weight:700;min-height:44px;padding:0 4px}

.list{margin:18px 0 0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:700;line-height:1.2}
.row .nm small{color:var(--muted);font-size:13px}
.row .num{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1;text-align:right;white-space:nowrap}
.row .num small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.thumb{flex:none;width:56px;height:56px;border-radius:12px;background:var(--panel)}
.thumb svg{width:100%;height:100%}

svg.fig{display:block}
.fig line{stroke:var(--fig);stroke-width:4.6;stroke-linecap:round;fill:none}
.fig .hd{fill:var(--fig)}
.fig .bk line{opacity:.36}
.fig .pr line{stroke:var(--prop);stroke-width:3.2}
.fig .pr circle{fill:none;stroke:var(--prop);stroke-width:2.4}
.fig line.q,.fig circle.q{stroke:var(--accent);stroke-width:3.4;fill:var(--panel)}
.fig line.w{stroke-width:5.5}
.fig circle.qd,.fig rect.q{fill:var(--accent);stroke:none}
.fig line.c{stroke:var(--prop);stroke-width:1.6}
.fig .gh{opacity:.2}
.stage{background:var(--panel);border-radius:18px;overflow:hidden}
.stage svg{width:100%;height:auto}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px}
.card h2,.sec{font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.05}
.sec{margin:26px 0 10px}
.fld{display:block;margin:14px 0 6px;font-size:14px;color:var(--muted)}
input[type=text],input[type=search],select{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px}
.dname{font-family:var(--disp);font-weight:800;font-size:28px!important;height:52px!important}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:500;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);font-size:14px;font-weight:500;background:var(--surface)}
.chips:not(.scroll) .chip{flex:1 1 auto}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

.stp{display:inline-flex;align-items:center;background:var(--panel);border-radius:12px;height:46px}
.stp button{width:34px;height:46px;font-size:22px;font-weight:500;line-height:1}
.stp input{width:50px;height:46px;border:0;background:transparent;text-align:center;font-family:var(--disp);font-weight:800;font-size:24px;padding:0;-moz-appearance:textfield;appearance:textfield;border-radius:0}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.edit{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.edit label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.edit .stp{width:100%;justify-content:space-between}
.edit .stp input{flex:1;min-width:0;width:0}
.edit label{min-width:0}
.edit.e3 .stp button{width:28px;flex:none}
.edit.e3{grid-template-columns:repeat(3,1fr);gap:10px 8px}
.edit .tools{grid-column:1/-1;display:flex;gap:8px}
.edit .tools button{flex:1;min-height:42px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:500}

/* allenamento */
#wk{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px)}
#wk .in{max-width:520px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
body.resting #wk .in{padding-bottom:calc(220px + env(safe-area-inset-bottom,0px))}
.wk-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 0}
.clock{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1;min-width:76px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--panel);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.steps{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 12px;padding:2px 16px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;width:40px;height:40px;border-radius:20px;border:1.5px solid var(--line);font-family:var(--disp);font-weight:800;font-size:18px}
.steps button.all{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.steps button[aria-current="step"]{border-color:var(--ink);border-width:2.5px}
.wk-name{font-family:var(--disp);font-weight:800;font-size:40px;line-height:.98;margin:14px 0 4px}
.cues{margin:10px 0 0;padding:0 0 0 20px;color:var(--ink)}
.cues li{margin-bottom:4px}
.warn{margin-top:8px;font-size:14px;color:var(--muted)}
.note{margin:12px 0;padding:10px 12px;border-radius:12px;background:var(--panel);font-size:14px;display:flex;align-items:center;gap:10px;justify-content:space-between}
.sets-h,.set{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center}
.sets-h{font-size:13px;color:var(--muted);margin:18px 0 6px;text-align:center}
.set{margin-bottom:8px}
.set .sn{font-family:var(--disp);font-weight:800;font-size:22px;color:var(--muted)}
.set .stp{width:100%;justify-content:space-between}
.set .stp input{flex:1;min-width:0}
.chk{width:52px;height:46px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center}
.chk svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set.done .chk svg{stroke:var(--bg)}
.set.done .stp{opacity:.55}

#rest{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--rest);color:var(--rest-ink);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.22)}
#rest .in2{max-width:488px;margin:0 auto}
#rest .r1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
#restNum{font-family:var(--disp);font-weight:800;font-size:92px;line-height:.82;font-variant-numeric:tabular-nums}
#restNext{font-size:14px;text-align:right;max-width:55%;padding-bottom:4px}
#rest .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.18);margin:12px 0;overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--rest-ink);width:100%}
#rest .r2{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
#rest .r2 button{min-height:48px;border-radius:12px;background:rgba(0,0,0,.14);font-weight:700;color:var(--rest-ink)}
#rest .r2 button.go{background:var(--rest-ink);color:var(--rest)}
#rest.fin{background:var(--ok);color:#fff}
#rest.fin .r2,#rest.fin .bar{display:none}
@media (prefers-reduced-motion:no-preference){#rest.fin{animation:pulse .5s 3}}
@keyframes pulse{50%{filter:brightness(1.35)}}

/* fogli */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet .in{max-width:488px;margin:0 auto}
.sh-top{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--bg);padding:8px 0;z-index:1}
.sh-top h2{font-family:var(--disp);font-weight:800;font-size:32px;line-height:1}
#cf{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:24px}
#cf .box{background:var(--surface);border-radius:18px;padding:20px;max-width:360px;width:100%}
#cf p{margin-bottom:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88%;text-align:center}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:14px 0 4px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars i.z{background:var(--line)}
.bars b{font-family:var(--disp);font-size:16px;color:var(--ink)}
.lead{font-size:18px;line-height:1.45}
.lead b{font-family:var(--disp);font-weight:800;font-size:1.35em;line-height:1}
.muted{color:var(--muted)}
.sm{font-size:14px}
.det{padding:6px 0 12px 0;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.det div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
</style>
</head>
<body>
<header class="top"><div class="brand">Ghisa</div>
  <button class="icon" data-act="settings" aria-label="Impostazioni"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1 .8z"/></svg></button>
</header>
<main class="wrap" id="view"></main>
<nav class="tabs" aria-label="Sezioni"><div>
  <button data-act="tab" data-t="oggi"><svg viewBox="0 0 24 24"><path d="M3 12h3M18 12h3M6 7v10M18 7v10M9 5v14M15 5v14M9 12h6"/></svg>Oggi</button>
  <button data-act="tab" data-t="scheda"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Scheda</button>
  <button data-act="tab" data-t="esercizi"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M6 10l6 1 6-1M12 15l-4 6M12 15l4 6"/></svg>Esercizi</button>
  <button data-act="tab" data-t="progressi"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>Progressi</button>
</div></nav>
<div id="wk" hidden><div class="in" id="wkBody"></div></div>
<div id="rest" hidden><div class="in2">
  <div class="r1"><div id="restNum" role="timer" aria-live="off">0:00</div><div id="restNext"></div></div>
  <div class="bar"><i id="restBar"></i></div>
  <div class="r2"><button data-act="restAdj" data-v="-15">−15 s</button><button data-act="restAdj" data-v="15">+15 s</button><button class="go" data-act="restSkip">Salta recupero</button></div>
</div></div>
<div id="scrim" hidden data-act="closeSheet"></div>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetBody"></div></div>
<div id="cf" hidden role="alertdialog" aria-modal="true"><div class="box"><p id="cfMsg"></p><div class="btn-row"><button class="btn ghost small" data-act="cfNo">Annulla</button><button class="btn small" id="cfYes" data-act="cfYes">Conferma</button></div></div></div>
<div id="toast" hidden role="status"></div>

<script>
/*FIG-START*/
const FL={ua:19,fa:18,th:24,sh:24};
function lerp(a,b,k){return a+(b-a)*k}
function ik(R,T,l1,l2,s){const dx=T[0]-R[0],dy=T[1]-R[1],d=Math.hypot(dx,dy)||.01,mx=l1+l2-.01,mn=Math.abs(l1-l2)+.01,dd=Math.min(mx,Math.max(mn,d)),a=Math.atan2(dy,dx),c=(l1*l1+dd*dd-l2*l2)/(2*l1*dd),p=Math.acos(Math.max(-1,Math.min(1,c)));
  return [[R[0]+l1*Math.cos(a+s*p),R[1]+l1*Math.sin(a+s*p)],[R[0]+dx/d*dd,R[1]+dy/d*dd]]}
function skel(F,k){
  const A=F.A,B=Object.assign({},A,F.B||{}),front=F.v==='f',o={t:lerp(A.t||0,B.t||0,k),tl:lerp(A.tl||32,B.tl||32,k)};
  for(const q of ['h','a','f','a2','f2'])if(A[q])o[q]=[lerp(A[q][0],B[q][0],k),lerp(A[q][1],B[q][1],k)];
  const nk=P=>{const r=(P.t||0)*Math.PI/180,tl=P.tl||32;return [P.h[0]+tl*Math.sin(r),P.h[1]-tl*Math.cos(r)]};
  const shOf=P=>{const n=nk(P);return front?[n[0]+11,n[1]+1]:n};
  const r=o.t*Math.PI/180,h=o.h,neck=nk(o),hd=F.hd||[9*Math.sin(r),-9*Math.cos(r)],head=[neck[0]+hd[0],neck[1]+hd[1]],sh=shOf(o),hp=front?[h[0]+5,h[1]]:h;
  const arm=q=>{if(!o[q])return null;let T=o[q];
    if(F.arc){const sa=shOf(A),sb=shOf(B),va=[A[q][0]-sa[0],A[q][1]-sa[1]],vb=[B[q][0]-sb[0],B[q][1]-sb[1]];let a1=Math.atan2(va[1],va[0]),d=Math.atan2(vb[1],vb[0])-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;const an=a1+d*k,rd=lerp(Math.hypot(va[0],va[1]),Math.hypot(vb[0],vb[1]),k);T=[sh[0]+rd*Math.cos(an),sh[1]+rd*Math.sin(an)]}
    return ik(sh,T,FL.ua,FL.fa,F.eb||1)};
  const leg=q=>o[q]?ik(hp,o[q],FL.th,FL.sh,F.kb||-1):null;
  return {front,h,neck,head,sh,hp,arm:arm('a'),arm2:arm('a2'),leg:leg('f'),leg2:leg('f2')}}
const n1=v=>v.toFixed(1);
const ln=(a,b,c)=>`<line x1="${n1(a[0])}" y1="${n1(a[1])}" x2="${n1(b[0])}" y2="${n1(b[1])}"${c?` class="${c}"`:''}/>`;
function figBody(F,k){

async function cloudInit(){

    const id=db&&user?await user.id():null;
    if(!id){cloud='local';return}
    col=db.collection('data/users/'+id);
    const snap=await col.limit(1000).get();
    let rm=null;const rs=[];
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='main')rm=clone(v);else if(d.id[0]==='w')rs.push(clone(v))});

    const del=new Set([...(S.deleted||[]),...((rm&&rm.deleted)||[])]);S.deleted=[...del].slice(-200);
    const map=new Map();rs.forEach(s=>map.set(s.id,s));
    const localOnly=H.filter(s=>!map.has(s.id)&&!del.has(s.id));
    H.forEach(s=>map.set(s.id,s));
    const merged=[...map.values()].filter(s=>!del.has(s.id)).sort((a,b)=>b.date-a.date);

}

function wLimits(e){const m=e.m;return m==='bar'?{step:2.5,min:S.settings.bar,max:S.settings.bar+54}:m==='db'||m==='db1'?{step:1,min:1,max:20}:m==='stack'?{step:2.5,min:2.5,max:200}:{step:1,min:0,max:54}}
function roundTo(v,st){return Math.round(v/st)*st}
function lastOf(id){for(const s of H){const it=s.items.find(x=>x.ex===id);if(it&&it.sets.length){const w=Math.max(...it.sets.map(x=>x.w));return {w,sets:it.sets,date:s.date,hit:it.sets.every(x=>x.r>=(it.t||x.r))&&it.sets.length>=2}}}return null}

function mkItem(id){
  const e=EXM[id],st=S.settings,lv=st.level,g=st.goal;
  let sets,reps,rest;
  if(g==='forza'){sets=e.c?4:3;reps=e.c?5:8;rest=e.c?150:90}
  else if(g==='res'){sets=3;reps=15;rest=45}
  else{sets=e.c?4:3;reps=e.c?8:12;rest=e.c?90:60}
  if(lv===1)sets=Math.max(e.c?3:2,sets-1);
  if(lv===3&&!e.c)sets+=1;
  let w=0;
  if(e.m==='bw'){reps=Math.max(4,Math.round(e.b*[.6,1,1.4][lv-1]*(g==='forza'?.8:g==='res'?1.3:1)*bwF()))}
  else if(e.m==='time'){reps=roundTo(e.b*[.7,1,1.5][lv-1],5);rest=Math.min(rest,60)}
  else{
    const L=wLimits(e),last=lastOf(id);
    if(last)w=last.w;
    else{w=roundTo(e.b*[.6,1,1.3][lv-1]*loadF()*repF(reps),L.step);if(w>L.max)reps+=3}

function genDay(groups,dur,avoid){
  avoid=avoid||new Set();
  const n=Math.max(groups.length,Math.round(dur/7.5)),tot=groups.reduce((a,g)=>a+GW[g],0);
  const cnt={};let used=0;groups.forEach(g=>{cnt[g]=Math.max(1,Math.floor(n*GW[g]/tot));used+=cnt[g]});
  const byW=[...groups].sort((a,b)=>GW[b]-GW[a]);let i=0;while(used<n){const g=byW[i%byW.length];if(cnt[g]<EX.filter(e=>e.g===g).length-1){cnt[g]++;used++}i++;if(i>60)break}
  const comp=[],iso=[],core=[];
  groups.forEach(g=>{
    const pool=EX.filter(e=>e.g===g&&e.id!=='panca_bil').map(e=>({e,k:(e.c?0:10)+(e.m==='bw'&&g!=='core'?3:0)+(avoid.has(e.id)?5:0)+Math.random()*6})).sort((a,b)=>a.k-b.k);
    const fams=new Set();let got=0;
    for(const {e} of pool){if(got>=cnt[g])break;if(e.fam&&fams.has(e.fam))continue;if(e.fam)fams.add(e.fam);got++;avoid.add(e.id);(g==='core'?core:e.c?comp:iso).push(e.id)}

/* ---------- allenamento ---------- */
function startWorkout(di){const d=S.days[di];if(!d||!d.items.length){toast('Aggiungi almeno un esercizio a questo giorno');return}
  S.active={dayId:d.id,name:d.name,start:Date.now(),cur:0,items:d.items.map(it=>({ex:it.ex,rest:it.rest,t:it.reps,sets:Array.from({length:it.sets},()=>({r:it.reps,w:it.w,done:false}))}))};
  persist();wake();renderWk()}
function hint(it){const e=EXM[it.ex];if(e.m!=='bar')return '';const s=it.sets.find(x=>!x.done)||it.sets[it.sets.length-1];return `Con il bilanciere da ${nf(S.settings.bar)} kg carica ${nf(Math.max(0,(s.w-S.settings.bar)/2))} kg per lato.`}
function renderWk(){
  const a=S.active,el=$('#wk');
  if(!a){el.hidden=true;document.body.classList.remove('lock');stopRest();return}
  el.hidden=false;document.body.classList.add('lock');
  const i=Math.min(a.cur,a.items.length-1),it=a.items[i],e=EXM[it.ex];
  const done=a.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0),tot=a.items.reduce((n,x)=>n+x.sets.length,0);
  const last=lastOf(it.ex),L=wLimits(e),canInc=last&&last.hit&&e.m!=='bw'&&e.m!=='time'&&it.sets.some(s=>!s.done&&s.w<=last.w&&s.w<L.max);
  let h=`<div class="wk-top"><span class="clock" id="clock">0:00</span><span class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${tot}" aria-valuenow="${done}" aria-label="Serie completate"><i style="width:${tot?done/tot*100:0}%"></i></span><button class="btn small" data-act="end">Termina</button></div>
  <div class="steps" role="group" aria-label="Esercizi">${a.items.map((x,j)=>`<button data-act="go" data-i="${j}" class="${x.sets.every(s=>s.done)?'all':''}"${j===i?' aria-current="step"':''} aria-label="Esercizio ${j+1}: ${EXM[x.ex].n}">${j+1}</button>`).join('')}<button data-act="addExA" aria-label="Aggiungi esercizio">+</button></div>
  ${stage(e.id)}<h1 class="wk-name">${e.n}</h1><p class="muted">${GROUPS[e.g]}, ${e.eq.toLowerCase()}</p>
  <ol class="cues">${e.cue.map(c=>`<li>${c}</li>`).join('')}</ol><p class="warn">${e.err}</p>`;
  if(last)h+=`<div class="note"><span>Ultima volta, ${new Date(last.date).toLocaleDateString('it-IT',{day:'numeric',month:'short'})}: ${last.sets.map(x=>x.r).join(', ')}${e.m==='time'?' secondi':e.m==='bw'?' ripetizioni':' a '+nf(last.w)+' kg'}.${canInc?' Le hai chiuse tutte.':''}</span>${canInc?`<button class="btn small" data-act="inc">+${nf(L.step)} kg</button>`:''}</div>`;
  h+=`<div class="sets-h"><span></span><span>${e.m==='bw'||e.m==='time'?'Zavorra, kg':e.m==='db'?'Kg per manubrio':'Kg'}</span><span>${e.m==='time'?'Secondi':'Ripetizioni'}</span><span>Fatta</span></div>`;
  it.sets.forEach((s,j)=>{h+=`<div class="set${s.done?' done':''}"><span class="sn">${j+1}</span>${stp(`a:${i}:${j}:w`,s.w,'peso serie '+(j+1))}${stp(`a:${i}:${j}:r`,s.r,'ripetizioni serie '+(j+1))}<button class="chk" data-act="done" data-j="${j}" aria-pressed="${s.done}" aria-label="Serie ${j+1} fatta">${CHECK}</button></div>`});
  h+=`<p class="muted sm" id="hint" style="margin:10px 0">${hint(it)}</p>
  <div class="btn-row"><button class="btn ghost small" data-act="addSet">Aggiungi serie</button>${it.sets.length>1?`<button class="btn ghost small" data-act="delSet">Togli serie</button>`:''}<button class="btn ghost small" data-act="swap">Sostituisci</button></div>
  <div class="btn-row" style="margin-top:8px">${i>0?`<button class="btn ghost small" data-act="go" data-i="${i-1}">Precedente</button>`:''}${i<a.items.length-1?`<button class="btn ghost small" data-act="go" data-i="${i+1}">Successivo</button>`:''}</div>`;
  $('#wkBody').innerHTML=h;tick()}
function nextPending(from){const a=S.active;for(let n=0;n<a.items.length;n++){const j=(from+n)%a.items.length;if(a.items[j].sets.some(s=>!s.done))return j}return -1}
function markDone(j){
  const a=S.active,it=a.items[a.cur],s=it.sets[j];audio();
  if(s.done){s.done=false;persist();renderWk();return}
  s.done=true;
  const sameLeft=it.sets.some(x=>!x.done),nx=sameLeft?a.cur:nextPending(a.cur+1);
  if(nx===-1){persist();stopRest();renderWk();endSheet(true);return}
  let next;
  if(sameLeft)next=`Poi serie ${it.sets.findIndex(x=>!x.done)+1} di ${it.sets.length}`;
  else{a.cur=nx;next='Poi '+EXM[a.items[nx].ex].n;$('#wk').scrollTop=0}
  persist();renderWk();startRest(it.rest,next)}
function endSheet(all){
  const a=S.active,done=a.items.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0),tot=a.items.reduce((n,x)=>n+x.sets.length,0);
  openSheet(()=>shTop(all?'Allenamento completato':'Termina allenamento')+`<p class="lead">Hai chiuso <b>${done}</b> serie su <b>${tot}</b> in <b>${Math.max(1,Math.round((Date.now()-a.start)/6e4))}</b> minuti.</p><div style="height:16px"></div>
    ${done?`<button class="btn" data-act="endSave">Salva allenamento</button><div style="height:8px"></div>`:''}${all?'':`<button class="btn ghost" data-act="closeSheet">Continua ad allenarti</button><div style="height:8px"></div>`}<button class="btn danger" data-act="endDrop">Esci senza salvare</button>`)}
function finish(save){
  const a=S.active;if(!a)return;let msg='Allenamento chiuso senza salvare';
  if(save){
    const items=a.items.map(it=>({ex:it.ex,t:it.t,sets:it.sets.filter(s=>s.done).map(s=>({r:s.r,w:s.w}))})).filter(it=>it.sets.length);
    const prs=items.filter(it=>{const e=EXM[it.ex],l=lastOf(it.ex);if(e.m==='bw'||e.m==='time')return false;let b=0;H.forEach(s=>s.items.forEach(x=>{if(x.ex===it.ex)x.sets.forEach(y=>b=Math.max(b,y.w))}));return l&&Math.max(...it.sets.map(s=>s.w))>b}).map(it=>EXM[it.ex].n);
    const vol=Math.round(items.reduce((v,it)=>v+it.sets.reduce((q,s)=>q+s.w*s.r*(EXM[it.ex].m==='db'?2:1)*(EXM[it.ex].m==='time'?0:1),0),0));
    const sess={id:'w'+Date.now(),date:Date.now(),name:a.name,dur:Math.max(1,Math.round((Date.now()-a.start)/6e4)),vol,items};
    H.unshift(sess);
    const day=S.days.find(d=>d.id===a.dayId);
    if(day)items.forEach(it=>{const p=day.items.find(x=>x.ex===it.ex),e=EXM[it.ex];if(p&&e.m!=='bw'&&e.m!=='time')p.w=Math.max(...it.sets.map(s=>s.w))});
    S.active=null;persist();pushSession(sess);
    msg=prs.length?`Salvato. Nuovo record: ${prs.slice(0,2).join(', ')}`:'Allenamento salvato, scheda aggiornata con i pesi di oggi';
  }else{S.active=null;persist()}
  closeSheet();stopRest();renderWk();releaseWake();render();toast(msg)}

/* ---------- recupero e suono ---------- */
let AC=null,beeps=[],rest=null,restHide=null;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state!=='running')AC.resume()}catch(e){}return AC}
function tone(at,f,dur,vol){const ac=AC;if(!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.015);g.gain.setValueAtTime(vol,at+dur-.04);g.gain.linearRampToValueAtTime(0,at+dur);o.connect(g);g.connect(ac.destination);o.start(at);o.stop(at+dur+.02);beeps.push(o)}catch(e){}}
function cancelBeeps(){beeps.forEach(o=>{try{o.stop(0);o.disconnect()}catch(e){}});beeps=[]}
function alarm(at){tone(at,988,.16,.55);tone(at+.22,988,.16,.55);tone(at+.44,1319,.5,.6)}
function scheduleBeeps(sec){cancelBeeps();if(!S.settings.sound)return;const ac=audio();if(!ac)return;const t=ac.currentTime+sec;[3,2,1].forEach(n=>{if(sec>n)tone(t-n,660,.09,.22)});alarm(t)}
function startRest(sec,next){clearTimeout(restHide);if(!sec||sec<=0){stopRest();return}
  document.body.classList.add('resting');rest={end:Date.now()+sec*1000,total:sec,fin:false};$('#restNext').textContent=next||'';$('#rest').classList.remove('fin');$('#rest').hidden=false;scheduleBeeps(sec);tick()}
function stopRest(){clearTimeout(restHide);cancelBeeps();rest=null;$('#rest').hidden=true;document.body.classList.remove('resting')}
function restDone(){rest.fin=true;$('#rest').classList.add('fin');$('#restNum').textContent='Via!';
  if(S.settings.sound&&AC&&AC.state!=='running'){audio();setTimeout(()=>{try{alarm(AC.currentTime+.05)}catch(e){}},120)}
  if(navigator.vibrate)try{navigator.vibrate([200,100,200])}catch(e){}
  restHide=setTimeout(()=>{rest=null;$('#rest').hidden=true;document.body.classList.remove('resting')},3500)}
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function tick(){
  if(S.active){const c=$('#clock');if(c)c.textContent=mmss((Date.now()-S.active.start)/1000)}
  if(rest&&!rest.fin){const left=(rest.end-Date.now())/1000;if(left<=0)restDone();else{$('#restNum').textContent=mmss(Math.ceil(left));$('#restBar').style.width=Math.max(0,Math.min(100,left/rest.total*100))+'%'}}}
setInterval(tick,250);
let wl=null;
async function wake(){try{if('wakeLock' in navigator&&S.active&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWake(){try{if(wl)wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();tick()}});

/* ---------- valori numerici ---------- */
function ref(k){const p=k.split(':');
  if(p[0]==='p'){const it=S.days[+p[1]].items[+p[2]],e=EXM[it.ex],f=p[3];
    return {o:it,f,...(f==='w'?wLimits(e):f==='sets'?{step:1,min:1,max:10}:f==='rest'?{step:15,min:0,max:600}:{step:e.m==='time'?5:1,min:1,max:e.m==='time'?600:100})}}
  if(p[0]==='a'){const it=S.active.items[+p[1]],e=EXM[it.ex],f=p[3],j=+p[2];
    return {o:it.sets[j],f,...(f==='w'?wLimits(e):{step:e.m==='time'?5:1,min:0,max:e.m==='time'?600:100}),after(old,v){
      for(let q=j+1;q<it.sets.length;q++){const s=it.sets[q];if(!s.done&&s[f]===old){s[f]=v;const el=document.querySelector(`input[data-k="a:${p[1]}:${q}:${f}"]`);if(el)el.value=v}}
      const hn=$('#hint');if(hn)hn.textContent=hint(it)}}}
  if(p[0]==='s')return {o:S.settings,f:p[1],...(p[1]==='bw'?{step:1,min:35,max:180}:p[1]==='h'?{step:1,min:140,max:215}:{step:.5,min:0,max:25})};
  return null}
function setK(k,v){const r=ref(k);if(!r)return;const old=r.o[r.f];if(isNaN(v))v=old;v=Math.min(r.max,Math.max(r.min,Math.round(v*4)/4));r.o[r.f]=v;
  document.querySelectorAll(`input[data-k="${k}"]`).forEach(el=>el.value=v);if(r.after&&v!==old)r.after(old,v);persist()}

/* ---------- azioni ---------- */
function openPicker(title,cb){pick={title,cb};libG='all';libQ='';openSheet(shPicker)}
const ACT={
  none(){},
  tab(d){tab=d.t;if(location.hash!=='#'+tab){try{location.hash=tab}catch(e){}}render();window.scrollTo(0,0)},
  wd(d){selWd=+d.v;render()},
  settings(){openSheet(shSettings)},
  closeSheet(){closeSheet()},
  cfNo(){$('#cf').hidden=true;cfCb=null},
  cfYes(){$('#cf').hidden=true;const f=cfCb;cfCb=null;if(f)f()},
  sset(d){const s=S.settings;if(d.f==='level')s.level=+d.v;else if(d.f==='sound'){s.sound=d.v==='1';if(s.sound)audio()}else s[d.f]=d.v;persist();sheetFn?reSheet():render()},
  gset(d){G[d.f]=d.f==='mode'?d.v:+d.v;G.prev=G.prevW=null;sheetFn?reSheet():render()},
  gchip(d){const i=G.groups.indexOf(d.v);i<0?G.groups.push(d.v):G.groups.splice(i,1);G.prev=null;reSheet()},
  gcompose(){if(G.mode==='day'){if(!G.groups.length){toast('Scegli almeno un gruppo muscolare');return}G.prev=genDay(G.groups,G.dur)}else G.prevW=genWeek(G.days,G.dur);reSheet()},
  gsave(){
    const apply=()=>{
      if(G.mode==='week'){S.days=G.prevW;selWd=S.days.some(d=>d.wd===todayWd())?todayWd():S.days[0].wd}
      else if(G.target==='new'||!S.days[+G.target]){const used=S.days.map(d=>d.wd),free=[0,1,2,3,4,5,6].find(i=>!used.includes(i));S.days.push({id:uid(),name:listJoin(G.groups.slice(0,2).map(g=>GROUPS[g])).replace(/^(.)(.*)$/,(m,a,b)=>a+b.toLowerCase()),wd:free===undefined?null:free,items:G.prev})}
      else S.days[+G.target].items=G.prev;
      G.prev=G.prevW=null;G.groups=[];G.target='new';persist();closeSheet();tab='scheda';render();toast('Scheda aggiornata')};
    if(G.mode==='week'&&S.days.length)confirmBox('La nuova settimana sostituisce tutti i giorni della scheda attuale. Lo storico resta.','Sostituisci',apply);else apply()},
  setupGo(){S.days=genWeek(G.days,45);selWd=S.days.some(d=>d.wd===todayWd())?todayWd():S.days[0].wd;persist();render();toast('Scheda creata: la trovi anche nella sezione Scheda')},
  setupEmpty(){S.days.push({id:uid(),name:'Giorno 1',wd:todayWd(),items:[]});persist();tab='scheda';render()},
  gen(){G.prev=G.prevW=null;openSheet(shGen)},
  addDay(){const used=S.days.map(d=>d.wd),free=[0,1,2,3,4,5,6].find(i=>!used.includes(i));S.days.push({id:uid(),name:'Giorno '+(S.days.length+1),wd:free===undefined?null:free,items:[]});persist();render()},
  delDay(d){const day=S.days[+d.d];confirmBox(`Elimino «${day.name}» dalla scheda?`,'Elimina',()=>{S.days.splice(+d.d,1);open=null;persist();render()})},
  toggle(d){open=open===d.o?null:d.o;render()},
  mv(d){const a=S.days[+d.d].items,i=+d.i,j=i+ +d.v;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];open=d.d+':'+j;persist();render()},
  delItem(d){S.days[+d.d].items.splice(+d.i,1);open=null;persist();render()},
  addEx(d){const di=+d.d;openPicker('Aggiungi esercizio',id=>{S.days[di].items.push(mkItem(id));persist();closeSheet();render();toast(EXM[id].n+' aggiunto')})},
  addTo(d){S.days[+d.d].items.push(mkItem(d.id));persist();closeSheet();render();toast('Aggiunto a '+S.days[+d.d].name)},
  lg(d){libG=d.v;if(sheetFn)reSheet();else render()},
  exInfo(d){openSheet(shExercise(d.id))},
  pick(d){if(pick)pick.cb(d.id)},
  start(d){if(S.active){renderWk();return}startWorkout(+d.d)},
  go(d){S.active.cur=+d.i;persist();renderWk();$('#wk').scrollTop=0},
  done(d){markDone(+d.j)},
  addSet(){const it=S.active.items[S.active.cur],l=it.sets[it.sets.length-1];it.sets.push({r:l.r,w:l.w,done:false});persist();renderWk()},
  delSet(){const it=S.active.items[S.active.cur];if(it.sets.length>1){it.sets.pop();persist();renderWk()}},
  inc(){const it=S.active.items[S.active.cur],L=wLimits(EXM[it.ex]);it.sets.forEach(s=>{if(!s.done)s.w=Math.min(L.max,s.w+L.step)});persist();renderWk()},
  swap(){const a=S.active,i=a.cur;openPicker('Sostituisci esercizio',id=>{const m=mkItem(id);a.items[i]={ex:id,rest:m.rest,t:m.reps,sets:Array.from({length:a.items[i].sets.length},()=>({r:m.reps,w:m.w,done:false}))};persist();closeSheet();renderWk()});libG=EXM[a.items[i].ex].g;reSheet()},
  addExA(){const a=S.active;openPicker('Aggiungi esercizio',id=>{const m=mkItem(id);a.items.push({ex:id,rest:m.rest,t:m.reps,sets:Array.from({length:m.sets},()=>({r:m.reps,w:m.w,done:false}))});a.cur=a.items.length-1;persist();closeSheet();renderWk()})},
  end(){endSheet(false)},
  endSave(){finish(true)},
  endDrop(){confirmBox('Esco senza salvare le serie di oggi?','Esci',()=>finish(false))},
  restAdj(d){if(!rest||rest.fin)return;const left=Math.max(1,(rest.end-Date.now())/1000+ +d.v);rest.end=Date.now()+left*1000;rest.total=Math.max(rest.total,left);scheduleBeeps(left);tick()},
  restSkip(){stopRest()},
  testSound(){const ac=audio();if(!ac){toast('Questo dispositivo non permette il suono qui');return}S.settings.sound=true;persist();alarm(ac.currentTime+.05);reSheet()},
  wipe(){confirmBox('Cancello scheda, impostazioni e tutto lo storico? Non si può annullare.','Cancella tutto',()=>{const del=[...(S.deleted||[]),...H.map(s=>s.id)].slice(-200);if(col)H.forEach(s=>col.doc(s.id).delete().catch(()=>{}));H=[];S=defaults();S.deleted=del;persist();closeSheet();tab='oggi';render();renderWk()})},
  sess(d){sessOpen=sessOpen===d.id?null:d.id;render()},
  delSess(d){confirmBox('Elimino questa seduta dallo storico?','Elimina',()=>{H=H.filter(s=>s.id!==d.id);S.deleted=[...(S.deleted||[]),d.id].slice(-200);if(col)col.doc(d.id).delete().catch(()=>{});persist();render()})}
};
document.addEventListener('click',ev=>{
  const sb=ev.target.closest('[data-step]');
  if(sb){const r=ref(sb.dataset.k);if(r)setK(sb.dataset.k,r.o[r.f]+r.step*+sb.dataset.step);return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  if(b.id==='scrim'&&ev.target!==b)return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset,b)});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;
  if(d.k&&t.type==='number')setK(d.k,parseFloat(String(t.value).replace(',','.')));
  else if(d.ch==='dname'){S.days[+d.d].name=t.value.trim()||'Giorno '+(+d.d+1);persist()}
  else if(d.ch==='dwd'){const v=t.value===''?null:+t.value;S.days.forEach((x,i)=>{if(v!=null&&x.wd===v&&i!==+d.d)x.wd=null});S.days[+d.d].wd=v;persist();render()}
  else if(d.ch==='gtarget'){G.target=t.value}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset.in==='q'){libQ=t.value;const l=$('#exlist');if(l)l.innerHTML=libList()}});
document.addEventListener('focusin',ev=>{const t=ev.target;if(t.type==='number'&&t.select)setTimeout(()=>{try{t.select()}catch(e){}},0)});
document.addEventListener('pointerdown',()=>{if(S.active&&S.settings.sound)audio()},{passive:true});
function route(){const h=(location.hash||'').slice(1);if(['oggi','scheda','esercizi','progressi'].includes(h)&&h!==tab){tab=h;render()}}
window.addEventListener('hashchange',route);
const h0=(location.hash||'').slice(1);if(['oggi','scheda','esercizi','progressi'].includes(h0))tab=h0;
if(!S.days.some(d=>d.wd===selWd)&&S.days.length&&!S.days.some(d=>d.wd===todayWd()))selWd=todayWd();
render();renderWk();cloudInit();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
